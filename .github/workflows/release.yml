name: Windows release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build portable executable
        shell: pwsh
        run: ./build.ps1
      - name: Hash release
        shell: pwsh
        run: |
          $hash = (Get-FileHash portable/VocalFolio.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  VocalFolio.exe" | Set-Content portable/SHA256SUMS.txt -Encoding ascii
      - name: Publish tag release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: gh release upload $env:GITHUB_REF_NAME portable/VocalFolio.exe portable/SHA256SUMS.txt --clobber || gh release create $env:GITHUB_REF_NAME portable/VocalFolio.exe portable/SHA256SUMS.txt --title "VocalFolio $env:GITHUB_REF_NAME" --notes-file CHANGELOG.md
